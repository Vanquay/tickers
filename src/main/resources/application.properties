spring.application.name=tickers
spring.main.web-application-type=reactive

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Streams
spring.kafka.streams.application-id=tickers-streams
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# PostgreSQL datasource for users + saved-stock watchlists
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Options-db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Log configuration
logging.level.root=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.com.agent.tickers=DEBUG

# Mute Kafka Streams / client noise (e.g. broker-not-reachable warnings)
logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.streams=OFF
logging.level.org.apache.kafka.clients.NetworkClient=OFF
logging.level.org.apache.kafka.clients.consumer.internals=OFF
